name: Build .NET solution

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrintFarm_Manager.sln
      - name: Build
        run: dotnet build PrintFarm_Manager.sln --configuration Release --no-restore
